spring.profiles.active: dev

spring:
  profiles:
    active: local-dev
  datasource:
    url: jdbc:h2:mem:db;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

spring.h2.console.enabled: true  # Habilita o console do H2
spring.h2.console.path: /h2-console

server:
  port: 8080

cache:
  type: caffeine
