spring.config.import:
  - classpath:application-internal.yml

spring.application.name: ${SPRING_APPLICATION_NAME}
spring.profiles.active: ${SPRING_PROFILES_ACTIVE:local-dev}

server.servlet.context-path: ${SERVER_SERVLET_CONTEXT_PATH}
server.port: ${SERVER_PORT:8080}

spring.datasource.url: ${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.datasource.username: ${SPRING_DATASOURCE_USERNAME}
spring.datasource.password: ${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql: ${SPRING_JPA_SHOW_SQL}

spring.h2.console.enabled: ${SPRING_H2_CONSOLE_ENABLED}
spring.h2.console.path: ${SPRING_H2_CONSOLE_PATH}


cache.type: ${CACHE_TYPE}
