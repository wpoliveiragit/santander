openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Autenticação
  description: Operações relacionadas à autenticação e geração de tokens JWT.
paths:
  /oauth/token:
    post:
      tags:
      - Autenticação
      summary: Gerar token JWT
      description: "Gera um token JWT para o usuário informado, definindo suas permissõ\
        es e validade."
      operationId: token
      parameters:
      - name: username
        in: query
        description: Identificação do usuário.
        required: true
        schema:
          type: string
        example: usuario
      responses:
        "200":
          description: Token gerado com sucesso.
          content:
            application/json:
              schema:
                type: object
                example:
                  access_token: <JWT_TOKEN>
        "400":
          description: Parâmetro username ausente ou inválido.
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
        "500":
          description: Erro interno ao gerar o token.
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /desafio/cadastrar:
    post:
      tags:
      - agency-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyEntity"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyEntity"
  /desafio/distancia:
    get:
      tags:
      - agency-controller
      operationId: calculateDistance
      parameters:
      - name: posX
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: posY
        in: query
        required: true
        schema:
          type: number
          format: double
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
                  format: double
components:
  schemas:
    AgencyEntity:
      type: object
      properties:
        id:
          type: integer
          format: int64
        posX:
          type: number
          format: double
        posY:
          type: number
          format: double
